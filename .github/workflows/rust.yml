name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --verbose
      - name: Run tests with parameters
        run: cargo test --locked --features parameters
      - name: Test corpus runner
        run: cargo test --locked --features mimalloc --example corpus
      - name: Run doc tests
        run: cargo test --locked --doc --verbose
      - name: Run example
        run: cargo run --locked --example basic
      - name: Build cdylib
        run: cargo rustc --locked --release --lib --features ffi --crate-type cdylib
      - name: Run Python tests
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests

  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Ruff format
        run: uvx ruff@0.17.0 format --check python setup.py
      - name: Ruff lint
        run: uvx ruff@0.17.0 check python setup.py
      - name: Mypy
        run: uvx mypy@2.4.0 --strict python/groebner

  corpus:
    name: Corpus (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: parallel
            cargo_args: "--features mimalloc"
          - mode: serial
            cargo_args: "--no-default-features --features mimalloc"
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Cache corpus build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-corpus-${{ matrix.mode }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('src/**/*.rs', 'examples/**/*.rs', 'tests/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-corpus-${{ matrix.mode }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Build corpus runner
        run: cargo build --locked --release --example corpus ${{ matrix.cargo_args }}
      - name: Check 256 corpus systems
        run: >-
          target/release/examples/corpus
          --manifest tests/corpus/ci.txt
          --field zp,gf32003,qq
          --algo f4
          --jobs 1
          --timeout 30
          --strict
          --out corpus-${{ matrix.mode }}.tsv
      - name: Upload corpus results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-${{ matrix.mode }}
          path: corpus-${{ matrix.mode }}.tsv
          retention-days: 14
