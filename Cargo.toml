[package]
name = "groebner"
version = "0.2.1"
authors = ["Stephen Diehl"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/groebner"
edition = "2021"
exclude = [
  ".github/**/*",
]
homepage = "https://github.com/sdiehl/groebner"
include = [
  "src/**/*",
  "examples/**/*",
  "tests/**/*",
  "benches/**/*",
  "README.md",
  "LICENSE",
  "Cargo.toml",
]
keywords = ["mathematics", "algebra", "polynomial", "groebner", "basis"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/groebner"
rust-version = "1.70.0"
description = "A Rust library implementing Groebner basis algorithms"

[lib]
name = "groebner"
path = "src/lib.rs"

[dependencies]
num-bigint = "0.5"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "buchberger"
path = "examples/buchberger.rs"

[[example]]
name = "f4"
path = "examples/f4.rs"

[[bench]]
name = "groebner_bench"
harness = false

[lints.rust]
dead_code = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
# pedantic = "warn"

unwrap_used = "deny"
panic = "deny"
expect_used = "warn"
get_unwrap = "warn"
exit = "warn"

single_match = "warn"
single_match_else = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
manual_let_else = "warn"

too_many_arguments = "warn"
too_many_lines = "warn"

needless_match = "warn"
needless_late_init = "warn"
needless_pass_by_value = "warn"
needless_continue = "warn"

redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
redundant_else = "warn"

needless_bool = "deny"
match_bool = "warn"

empty_drop = "warn"
empty_structs_with_brackets = "warn"

rc_buffer = "warn"
rc_mutex = "warn"

rest_pat_in_fully_bound_structs = "warn"
